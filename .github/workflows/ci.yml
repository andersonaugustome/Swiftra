name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  mysql:
    name: Integration (MySQL 8.4)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: swiftra_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SWIFTRA_MYSQL_TEST: "1"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: swiftra_test
      DB_USERNAME: root
      DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - name: Test against real MySQL
        run: swift test --filter MySQLIntegrationTests
